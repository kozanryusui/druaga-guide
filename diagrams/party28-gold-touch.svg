<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" aria-label="Opening scene, before normal play. Tap 1 six times, then 2 four times, then 3 three times. Lift your finger after every tap. Aim at the labels: (320,90), (120,240), (520,240) on the 640 by 480 touch screen. Finish before the opening character message disappears."><rect width="640" height="480" fill="#26363b"/><g><g class="targets"><rect class="exact-region" fill="#d52d3a" fill-opacity="0.5" stroke="#ff7b70" stroke-width="1.5" x="200" y="0" width="240" height="180"/><text fill="white" font-size="24" font-family="sans-serif" text-anchor="middle" x="320" y="85">1: 6 taps</text><rect class="exact-region" fill="#d52d3a" fill-opacity="0.5" stroke="#ff7b70" stroke-width="1.5" x="0" y="120" width="240" height="240"/><text fill="white" font-size="24" font-family="sans-serif" text-anchor="middle" x="120" y="235">2: 4 taps</text><rect class="exact-region" fill="#d52d3a" fill-opacity="0.5" stroke="#ff7b70" stroke-width="1.5" x="400" y="120" width="240" height="240"/><text fill="white" font-size="24" font-family="sans-serif" text-anchor="middle" x="520" y="235">3: 3 taps</text></g></g></svg>
